<title>Футбол трёх команд</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Oswald:wght@500;600&family=Unbounded:wght@600;700&display=swap">
<style>
/* Layout: one narrow column like a scoreboard card; match screen = timer on top, two team halves side by side */
:root{
  --bg:#EEF2EE; --surface:#FFFFFF; --fg:#13201A; --muted:#5D6B63; --line:#D9E1DB;
  --accent:#17834A; --accent-ink:#FFFFFF; --soft:#E2EBE4; --danger:#C2362F;
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-num:"Oswald","Arial Narrow",system-ui,sans-serif;
  --f-body:"Golos Text",-apple-system,system-ui,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1310; --surface:#162019; --fg:#E7EFE9; --muted:#8E9C94; --line:#26332B;
  --accent:#36C47A; --accent-ink:#06150C; --soft:#1E2B23; --danger:#F06A60; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1310; --surface:#162019; --fg:#E7EFE9; --muted:#8E9C94; --line:#26332B;
  --accent:#36C47A; --accent-ink:#06150C; --soft:#1E2B23; --danger:#F06A60; color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.4}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px 40px;display:flex;flex-direction:column;gap:16px}

header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
header.bar .in{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;align-items:center;gap:12px}
.logo{font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.01em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{display:flex;background:var(--soft);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:7px 14px;border-radius:999px;font-weight:500;font-size:14px;color:var(--muted)}
.seg button[aria-current="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
body.in-match header.bar{display:none}

h2{font-family:var(--f-display);font-size:17px;font-weight:600;margin:0;text-wrap:balance}
h3{font-family:var(--f-display);font-size:16px;font-weight:600;margin:0 0 4px;text-wrap:balance}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.grow{flex:1;min-width:0}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 16px;font-weight:600;min-height:46px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger)}
.btn.block{width:100%}
.btn.ghost{background:none;border-color:transparent;color:var(--muted);font-weight:500}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;padding:8px 0}

.sw{display:inline-block;width:14px;height:14px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.18)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--soft);border-radius:999px;padding:6px 10px;font-size:14px}
.chip button{border:0;background:none;padding:0 2px;color:var(--muted);font-size:16px;line-height:1}
.chip.add{background:none;border-style:dashed;color:var(--muted)}

/* standings */
.tbl-wrap{overflow-x:auto;margin:0 -14px;padding:0 14px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;text-align:center;padding:4px 4px 8px}
th:nth-child(2){text-align:left}
td{padding:10px 4px;border-top:1px solid var(--line);text-align:center;font-family:var(--f-num);font-size:17px}
td.team{text-align:left;font-family:var(--f-body);font-size:15px;font-weight:600}
td.team span.n{display:inline-flex;align-items:center;gap:8px}
td.pos{color:var(--muted);width:22px}
td.pts{font-weight:600;font-size:19px}
td.gd-p{color:var(--accent)} td.gd-n{color:var(--danger)}

/* live card */
.live{border:0;background:var(--fg);color:var(--bg);cursor:pointer;text-align:left;border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;width:100%}
.live .label{color:inherit;opacity:.7}
.live .vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.live .tn{display:flex;align-items:center;gap:8px;font-weight:600;min-width:0}
.live .tn.r{justify-content:flex-end;text-align:right}
.live .sc{font-family:var(--f-num);font-size:34px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.live .go{display:flex;justify-content:space-between;align-items:center;font-size:14px;opacity:.85}
.live .tm{font-family:var(--f-num);font-size:18px;font-variant-numeric:tabular-nums}

.mlist{display:flex;flex-direction:column}
.mrow{display:grid;grid-template-columns:28px 1fr auto 1fr;gap:8px;align-items:center;padding:10px 0;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.mrow:first-child{border-top:0}
.mrow .no{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.mrow .t{display:flex;gap:6px;align-items:center;min-width:0;font-weight:500}
.mrow .t.r{justify-content:flex-end;text-align:right}
.mrow .t b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.mrow .s{font-family:var(--f-num);font-size:18px;font-weight:600;font-variant-numeric:tabular-nums;min-width:52px;text-align:center}
.mrow .w{font-weight:700}
.round-sep{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;padding:10px 0 2px;font-weight:600}

/* setup */
.swatches{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.swb{width:32px;height:32px;border-radius:50%;border:2px solid transparent;box-shadow:inset 0 0 0 1px rgba(0,0,0,.18);padding:0}
.swb[aria-pressed="true"]{border-color:var(--fg);box-shadow:inset 0 0 0 3px var(--surface)}
.swcustom{position:relative;width:32px;height:32px;border-radius:50%;border:1px dashed var(--muted);display:grid;place-items:center;font-size:18px;color:var(--muted);overflow:hidden}
.swcustom input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.tcard{border-left:6px solid var(--tc)}
.field{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;min-height:44px}
.namefield{font-weight:600;font-size:17px}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:20px;font-weight:600}
.stepper output{font-family:var(--f-num);font-size:22px;font-weight:600;min-width:44px;text-align:center;font-variant-numeric:tabular-nums}
.settings{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.settings > div{display:flex;flex-direction:column;gap:6px}
.pairs{display:flex;flex-direction:column;gap:6px}
.pair{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface);text-align:left;width:100%}
.pair[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.pair .dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);flex:none}
.pair[aria-pressed="true"] .dot{border:6px solid var(--accent)}
.knownlist{display:flex;gap:6px;flex-wrap:wrap}

/* match screen */
.match{min-height:100%;display:flex;flex-direction:column;gap:14px;max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 24px}
.mtop{display:flex;justify-content:space-between;align-items:center;gap:8px}
.clock{border:0;background:none;padding:0;font-family:var(--f-num);font-weight:600;font-size:clamp(72px,26vw,140px);line-height:1;letter-spacing:.01em;font-variant-numeric:tabular-nums;text-align:center;width:100%}
.clock.low{color:var(--danger)}
.clock-hint{text-align:center;font-size:13px;color:var(--muted);margin-top:-6px}
.ctrls{display:grid;grid-template-columns:2fr 1fr;gap:10px}
.ctrls .btn{min-height:58px;font-size:17px}
.halves{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.half{border-radius:var(--r);overflow:hidden;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
.half .hd{background:var(--tc);color:var(--ti);padding:10px 12px;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.half .big{font-family:var(--f-num);font-size:72px;font-weight:600;text-align:center;line-height:1.1;font-variant-numeric:tabular-nums;padding-top:6px}
.half .acts{display:grid;grid-template-columns:auto 1fr;gap:8px;padding:0 10px 10px}
.half .acts .btn{min-height:56px}
.half .plus{font-size:18px;background:var(--tc);color:var(--ti);border-color:var(--tc)}
.half .minus{width:52px;font-size:22px;padding:0}
.scorers{padding:0 12px 12px;font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:2px;min-height:20px}

/* sheet */
#sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
#sheet .bd{position:absolute;inset:0;background:rgba(0,0,0,.45)}
#sheet .panel{position:relative;background:var(--surface);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:18px max(16px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));max-height:85%;overflow-y:auto;display:flex;flex-direction:column;gap:14px;animation:up .18s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.picks{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.picks .btn{text-align:left}
.bigline{font-family:var(--f-num);font-size:30px;font-weight:600;text-align:center;font-variant-numeric:tabular-nums}
.edit2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.edit2 > div{display:flex;flex-direction:column;gap:8px;min-width:0}
.gl{display:flex;flex-direction:column;gap:6px}
.timeedit{display:flex;align-items:center;justify-content:center;gap:8px}
.timeedit input{width:84px;text-align:center;font-family:var(--f-num);font-size:34px;font-weight:600;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:6px}
.timeedit span{font-family:var(--f-num);font-size:34px}
textarea{width:100%;min-height:160px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px;font:12px ui-monospace,monospace;color:var(--fg)}

#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:500;z-index:30;max-width:calc(100% - 32px);text-align:center}

.tabs{display:flex;gap:6px}
.tabs button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:500}
.tabs button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.empty{text-align:center;color:var(--muted);padding:24px 8px}
.bar-meter{height:6px;border-radius:3px;background:var(--soft);overflow:hidden}
.bar-meter i{display:block;height:100%;background:var(--accent)}
@media (prefers-reduced-motion: reduce){#sheet .panel{animation:none}}
</style>

<header class="bar"><div class="in">
  <div class="logo">Футбол · 3 команды</div>
  <nav class="seg">
    <button data-act="nav" data-v="home" data-nav="1">Турнир</button>
    <button data-act="nav" data-v="stats" data-nav="1">История</button>
  </nav>
</div></header>
<main id="app"></main>
<div id="sheet" hidden><div class="bd" data-act="closeSheet"></div><div class="panel" id="sheetBody"></div></div>
<div id="toast" hidden></div>

<script>
const KEY = 'futbol3.v1';
const COLORS = [['Красные','#E03A3A'],['Синие','#2F6FE0'],['Жёлтые','#F2C230'],['Зелёные','#2E9E5B'],
  ['Оранжевые','#F07A1F'],['Фиолетовые','#7B4FD6'],['Белые','#F4F4F4'],['Чёрные','#222222']];
const COLOR_NAMES = new Set(COLORS.map(c => c[0]));
const PAIRS = [[0,1],[0,2],[1,2]];

const uid = () => Math.random().toString(36).slice(2, 9);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ink = hex => { const n = parseInt(hex.slice(1), 16); return (0.299*(n>>16) + 0.587*(n>>8&255) + 0.114*(n&255)) > 165 ? '#111' : '#fff'; };
const fmt = sec => { sec = Math.ceil(sec); return Math.floor(sec/60) + ':' + String(sec%60).padStart(2,'0'); };

/* ---------- storage ---------- */
let S = load();
function load() {
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && Array.isArray(s.players)) return s; } catch (e) {}
  return { players: [], cur: null, history: [], draft: null };
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
if (!S.draft) S.draft = newDraft();

function newDraft() {
  const last = S && S.history && S.history[S.history.length - 1];
  const teams = last
    ? last.teams.map(t => ({ id: uid(), name: t.name, color: t.color, players: [...t.players] }))
    : COLORS.slice(0, 3).map(([n, c]) => ({ id: uid(), name: n, color: c, players: [] }));
  return { rounds: last ? last.rounds : 5, minutes: last ? last.duration / 60 : 5, teams, first: 0 };
}
const pname = id => (S.players.find(p => p.id === id) || {}).name || '—';
function playerByName(name) {
  name = name.trim().replace(/\s+/g, ' ');
  if (!name) return null;
  let p = S.players.find(x => x.name.toLowerCase() === name.toLowerCase());
  if (!p) { p = { id: uid(), name }; S.players.push(p); }
  return p;
}

/* ---------- tournament logic ---------- */
const team = (t, id) => t.teams.find(x => x.id === id);
const score = (m, side) => m.goals.filter(g => g.s === side).length;
const winnerOf = m => { const a = score(m,'a'), b = score(m,'b'); return a > b ? m.a : b > a ? m.b : null; };
const totalMatches = t => t.rounds * 3;
const pk = (a, b) => [a, b].sort().join('|');

// Круг 1: первая пара → победитель (или по жребию при ничьей) играет с третьей → оставшаяся пара.
// Круги 2+: тот же порядок пар, что сложился в первом круге.
function nextPair(t) {
  const M = t.matches, k = M.length;
  if (k >= totalMatches(t)) return null;
  if (k === 0) return t.first;
  if (k === 1) {
    const m = M[0];
    let stay = winnerOf(m);
    if (!stay) { if (!m.stay) m.stay = Math.random() < .5 ? m.a : m.b; stay = m.stay; }
    const third = t.teams.find(x => x.id !== m.a && x.id !== m.b).id;
    return [stay, third];
  }
  if (k === 2) {
    const played = new Set(M.map(m => pk(m.a, m.b)));
    for (const [i, j] of PAIRS) { const a = t.teams[i].id, b = t.teams[j].id; if (!played.has(pk(a, b))) return [a, b]; }
  }
  const ref = M[k % 3];
  return [ref.a, ref.b];
}
function ensureLive(t) {
  const p = nextPair(t);
  if (!p) { if (t.live && !t.live.started) t.live = null; return; }
  if (!t.live) t.live = { a: p[0], b: p[1], goals: [], remaining: t.duration, running: false, endAt: 0, started: false };
  else if (!t.live.started) { t.live.a = p[0]; t.live.b = p[1]; }
}
function standings(t) {
  const rows = t.teams.map(x => ({ team: x, p:0, w:0, d:0, l:0, gf:0, ga:0, pts:0 }));
  const by = id => rows.find(r => r.team.id === id);
  for (const m of t.matches) {
    const A = by(m.a), B = by(m.b), a = score(m,'a'), b = score(m,'b');
    A.p++; B.p++; A.gf += a; A.ga += b; B.gf += b; B.ga += a;
    if (a > b) { A.w++; B.l++; A.pts += 3; } else if (b > a) { B.w++; A.l++; B.pts += 3; } else { A.d++; B.d++; A.pts++; B.pts++; }
  }
  return rows.sort((x, y) => y.pts - x.pts || (y.gf - y.ga) - (x.gf - x.ga) || y.gf - x.gf);
}

/* ---------- whistle (Web Audio) ---------- */
let AC = null;
function ac() {
  if (!AC) { const C = window.AudioContext || window.webkitAudioContext; if (C) AC = new C(); }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function blow(a, start, dur) {
  const o = a.createOscillator(), lfo = a.createOscillator(), lg = a.createGain(), g = a.createGain();
  o.type = 'sine'; o.frequency.value = 2850;
  lfo.frequency.value = 26; lg.gain.value = 220; lfo.connect(lg); lg.connect(o.frequency);
  g.gain.setValueAtTime(0, start);
  g.gain.linearRampToValueAtTime(.4, start + .02);
  g.gain.setValueAtTime(.4, start + dur - .05);
  g.gain.linearRampToValueAtTime(0, start + dur);
  o.connect(g); g.connect(a.destination);
  o.start(start); lfo.start(start); o.stop(start + dur); lfo.stop(start + dur);
}
function whistle(kind) {
  const a = ac(); if (!a) return;
  const t = a.currentTime + .03;
  if (kind === 'start') blow(a, t, .45);
  else if (kind === 'pause') { blow(a, t, .22); blow(a, t + .32, .22); }
  else { blow(a, t, .35); blow(a, t + .5, .35); blow(a, t + 1, 1.1); }
}
let wake = null;
async function keepAwake(on) {
  try {
    if (on && !wake && navigator.wakeLock) { wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release', () => wake = null); }
    else if (!on && wake) { await wake.release(); wake = null; }
  } catch (e) {}
}

/* ---------- timer ---------- */
const rem = L => L.running ? Math.max(0, (L.endAt - Date.now()) / 1000) : L.remaining;
setInterval(() => {
  const L = S.cur && S.cur.live;
  if (!L || !L.running) return;
  const r = rem(L);
  if (r <= 0) {
    L.running = false; L.remaining = 0; save();
    whistle('end'); keepAwake(false); render(); toast('Время вышло');
  } else {
    document.querySelectorAll('[data-timer]').forEach(e => { e.textContent = fmt(r); e.classList.toggle('low', r <= 30); });
  }
}, 200);

/* ---------- views ---------- */
let view = 'home', statTab = 'colors', pickCb = null;
function go(v) { view = v; render(); window.scrollTo(0, 0); }
function render() {
  const app = document.getElementById('app');
  if (S.cur) ensureLive(S.cur);
  if (view === 'match' && !(S.cur && S.cur.live)) view = 'home';
  document.body.classList.toggle('in-match', view === 'match');
  document.querySelectorAll('[data-nav]').forEach(b => b.setAttribute('aria-current', b.dataset.v === view ? 'true' : 'false'));
  app.innerHTML = view === 'stats' ? statsView() : view === 'match' ? matchView() : S.cur ? homeView() : setupView();
}
const tn = (t, id, cls = '') => { const x = team(t, id); return `<span class="sw" style="background:${x.color}"></span><b class="${cls}">${esc(x.name)}</b>`; };

function setupView() {
  const d = S.draft;
  const used = new Set(d.teams.flatMap(t => t.players));
  const known = S.players.filter(p => !used.has(p.id)).sort((a, b) => a.name.localeCompare(b.name, 'ru'));
  const noPlayers = !S.players.length && d.teams.every(t => !t.players.length);
  const teams = d.teams.map((t, i) => `
    <section class="card tcard" style="--tc:${t.color}">
      <input class="field namefield" id="tname${i}" data-field="name" data-i="${i}" value="${esc(t.name)}" placeholder="Название команды" aria-label="Название команды">
      <div class="swatches">
        ${COLORS.map(([n, c]) => `<button class="swb" style="background:${c}" aria-label="${n}" aria-pressed="${t.color.toLowerCase() === c.toLowerCase()}" data-act="swatch" data-i="${i}" data-c="${c}" data-n="${n}"></button>`).join('')}
        <label class="swcustom" title="Свой цвет">+<input type="color" id="tcol${i}" data-field="color" data-i="${i}" value="${t.color}"></label>
      </div>
      <div class="label">Состав · ${t.players.length}</div>
      <div class="row">${t.players.map((p, j) => `<span class="chip">${esc(pname(p))}<button data-act="rmPlayer" data-i="${i}" data-j="${j}" aria-label="Убрать">×</button></span>`).join('') || '<span class="muted">Пока никого</span>'}</div>
      <div class="row">
        <input class="field grow" id="pin${i}" list="plist" placeholder="Имя Фамилия" data-enter="addPlayer" data-i="${i}" autocomplete="off">
        <button class="btn" data-act="addPlayer" data-i="${i}">Добавить</button>
      </div>
      ${known.length ? `<div class="knownlist">${known.map(p => `<button class="chip add" data-act="pickKnown" data-i="${i}" data-p="${p.id}">+ ${esc(p.name)}</button>`).join('')}</div>` : ''}
    </section>`).join('');
  return `<div class="wrap">
    <div><div class="label">Новый турнир</div><h2>Команды и составы</h2></div>
    ${noPlayers ? `<button class="link" data-act="sample">Заполнить примером (тестовые имена)</button>` : ''}
    ${teams}
    <datalist id="plist">${S.players.map(p => `<option value="${esc(p.name)}">`).join('')}</datalist>
    <section class="card">
      <div class="settings">
        <div><span class="label">Кругов</span>
          <div class="stepper"><button data-act="step" data-f="rounds" data-d="-1" aria-label="Меньше">−</button><output>${d.rounds}</output><button data-act="step" data-f="rounds" data-d="1" aria-label="Больше">+</button></div>
          <span class="muted">${d.rounds * 3} матчей</span></div>
        <div><span class="label">Матч, мин</span>
          <div class="stepper"><button data-act="step" data-f="minutes" data-d="-1" aria-label="Меньше">−</button><output>${d.minutes}</output><button data-act="step" data-f="minutes" data-d="1" aria-label="Больше">+</button></div></div>
      </div>
      <div class="label">Кто играет первым</div>
      <div class="pairs">${PAIRS.map(([a, b], k) => `<button class="pair" aria-pressed="${d.first === k}" data-act="first" data-k="${k}"><span class="dot"></span>
        <span class="sw" style="background:${d.teams[a].color}"></span>${esc(d.teams[a].name)} <span class="muted">—</span> <span class="sw" style="background:${d.teams[b].color}"></span>${esc(d.teams[b].name)}</button>`).join('')}</div>
    </section>
    <button class="btn primary block" data-act="start">Начать турнир</button>
  </div>`;
}

function homeView() {
  const t = S.cur, rows = standings(t), L = t.live, n = totalMatches(t);
  const tbl = `<div class="tbl-wrap"><table>
    <thead><tr><th></th><th>Команда</th><th>И</th><th>В</th><th>Н</th><th>П</th><th>Мячи</th><th>±</th><th>О</th></tr></thead>
    <tbody>${rows.map((r, i) => { const gd = r.gf - r.ga; return `<tr>
      <td class="pos">${i + 1}</td><td class="team"><span class="n"><span class="sw" style="background:${r.team.color}"></span>${esc(r.team.name)}</span></td>
      <td>${r.p}</td><td>${r.w}</td><td>${r.d}</td><td>${r.l}</td><td>${r.gf}:${r.ga}</td>
      <td class="${gd > 0 ? 'gd-p' : gd < 0 ? 'gd-n' : ''}">${gd > 0 ? '+' + gd : gd}</td><td class="pts">${r.pts}</td></tr>`; }).join('')}</tbody></table></div>`;
  const k = t.matches.length;
  const live = L ? `<button class="live" data-act="nav" data-v="match">
      <span class="label">Текущий матч · ${k + 1} из ${n} · круг ${Math.floor(k / 3) + 1}</span>
      <span class="vs"><span class="tn">${tn(t, L.a)}</span><span class="sc">${score(L,'a')}:${score(L,'b')}</span><span class="tn r">${tn(t, L.b)}</span></span>
      <span class="go"><span class="tm" data-timer>${fmt(rem(L))}</span><span>${L.running ? 'Идёт · открыть' : L.started ? 'Пауза · открыть' : 'Открыть матч →'}</span></span>
    </button>`
    : `<section class="card"><h3>Все ${n} матчей сыграны</h3><p class="muted" style="margin:0">Проверь результаты и заверши турнир, чтобы сохранить его в историю.</p>
       <button class="btn primary" data-act="endT">Завершить турнир</button></section>`;
  let list = '';
  for (let i = k - 1; i >= 0; i--) {
    const m = t.matches[i], w = winnerOf(m);
    if (i % 3 === 2 || i === k - 1) list += `<div class="round-sep">Круг ${Math.floor(i / 3) + 1}</div>`;
    list += `<button class="mrow" data-act="editM" data-m="${i}"><span class="no">${i + 1}</span>
      <span class="t">${tn(t, m.a, w === m.a ? 'w' : '')}</span><span class="s">${score(m,'a')}:${score(m,'b')}</span><span class="t r">${tn(t, m.b, w === m.b ? 'w' : '')}</span></button>`;
  }
  return `<div class="wrap">
    <section class="card"><div class="row"><h2 class="grow">Таблица</h2><span class="muted">${t.rounds} кр. · ${t.duration / 60} мин</span></div>${tbl}</section>
    ${live}
    ${k ? `<section class="card"><div class="row"><h2 class="grow">Сыгранные матчи</h2><span class="muted">нажми, чтобы исправить</span></div><div class="mlist">${list}</div></section>` : ''}
    ${L ? `<button class="link" data-act="endT">Завершить турнир досрочно</button>` : ''}
  </div>`;
}

function matchView() {
  const t = S.cur, L = t.live, k = t.matches.length, r = rem(L);
  const half = side => {
    const x = team(t, L[side]);
    const counts = {};
    L.goals.filter(g => g.s === side).forEach(g => { const nm = g.p ? pname(g.p) : 'без автора'; counts[nm] = (counts[nm] || 0) + 1; });
    return `<div class="half" style="--tc:${x.color};--ti:${ink(x.color)}">
      <div class="hd">${esc(x.name)}</div>
      <div class="big">${score(L, side)}</div>
      <div class="acts"><button class="btn minus" data-act="minus" data-s="${side}" aria-label="Убрать гол">−</button><button class="btn plus" data-act="plus" data-s="${side}">+ Гол</button></div>
      <div class="scorers">${Object.entries(counts).map(([n, c]) => `<span>⚽ ${esc(n)}${c > 1 ? ' ×' + c : ''}</span>`).join('')}</div>
    </div>`;
  };
  return `<div class="match">
    <div class="mtop"><button class="btn ghost" data-act="nav" data-v="home">← Таблица</button><span class="label">Матч ${k + 1} из ${totalMatches(t)} · круг ${Math.floor(k / 3) + 1}</span></div>
    <button class="clock ${r <= 30 && r > 0 ? 'low' : ''}" data-timer data-act="editTime" aria-label="Изменить время">${fmt(r)}</button>
    <div class="clock-hint">${r <= 0 ? 'Время вышло' : 'Нажми на время, чтобы изменить'}</div>
    <div class="ctrls">
      <button class="btn ${L.running ? '' : 'primary'}" data-act="play" ${r <= 0 ? 'disabled' : ''}>${L.running ? '❚❚ Пауза' : L.started ? '▶ Продолжить' : '▶ Старт'}</button>
      <button class="btn danger" data-act="finish">■ Стоп</button>
    </div>
    <div class="halves">${half('a')}${half('b')}</div>
  </div>`;
}

function statsView() {
  const H = S.history;
  const tabs = `<div class="tabs">${[['colors','Цвета'],['players','Игроки'],['list','Турниры']].map(([k, n]) => `<button aria-pressed="${statTab === k}" data-act="tab" data-k="${k}">${n}</button>`).join('')}</div>`;
  let body = '';
  if (!H.length) body = `<div class="card empty">Здесь появится статистика после первого завершённого турнира.</div>`;
  else if (statTab === 'colors') {
    const map = {};
    for (const t of H) standings(t).forEach((r, i) => {
      const key = r.team.name.trim().toLowerCase();
      const o = map[key] || (map[key] = { name: r.team.name, color: r.team.color, t: 0, first: 0, w: 0, d: 0, l: 0, p: 0 });
      o.t++; if (i === 0) o.first++; o.w += r.w; o.d += r.d; o.l += r.l; o.p += r.p; o.color = r.team.color;
    });
    const rows = Object.values(map).sort((a, b) => b.first - a.first || b.w / (b.p || 1) - a.w / (a.p || 1));
    body = `<section class="card"><div class="tbl-wrap"><table><thead><tr><th></th><th>Цвет</th><th>Тур.</th><th>1-е</th><th>В</th><th>Н</th><th>П</th><th>% побед</th></tr></thead><tbody>
      ${rows.map((o, i) => `<tr><td class="pos">${i + 1}</td><td class="team"><span class="n"><span class="sw" style="background:${o.color}"></span>${esc(o.name)}</span></td>
      <td>${o.t}</td><td class="pts">${o.first}</td><td>${o.w}</td><td>${o.d}</td><td>${o.l}</td><td>${o.p ? Math.round(o.w / o.p * 100) : 0}%</td></tr>`).join('')}
      </tbody></table></div><span class="muted">«1-е» — сколько турниров цвет выиграл. Цвета сравниваются по названию команды.</span></section>`;
  } else if (statTab === 'players') {
    const map = {};
    for (const t of H) {
      standings(t).forEach((r, i) => r.team.players.forEach(pid => {
        const o = map[pid] || (map[pid] = { id: pid, t: 0, pl: [0, 0, 0], sum: 0, g: 0 });
        o.t++; o.pl[i]++; o.sum += i + 1;
      }));
      t.matches.forEach(m => m.goals.forEach(g => { if (g.p && map[g.p]) map[g.p].g++; }));
    }
    const rows = Object.values(map).sort((a, b) => a.sum / a.t - b.sum / b.t || b.pl[0] - a.pl[0] || b.g - a.g);
    body = `<section class="card"><div class="tbl-wrap"><table><thead><tr><th></th><th>Игрок</th><th>Тур.</th><th>1</th><th>2</th><th>3</th><th>Ср.</th><th>Голы</th></tr></thead><tbody>
      ${rows.map((o, i) => `<tr><td class="pos">${i + 1}</td><td class="team">${esc(pname(o.id))}</td><td>${o.t}</td><td class="pts">${o.pl[0]}</td><td>${o.pl[1]}</td><td>${o.pl[2]}</td><td>${(o.sum / o.t).toFixed(1)}</td><td>${o.g}</td></tr>`).join('')}
      </tbody></table></div><span class="muted">Место игрока — итоговое место его команды. «Ср.» — среднее место, чем меньше, тем лучше.</span></section>`;
  } else {
    body = H.slice().reverse().map(t => {
      const rows = standings(t);
      return `<section class="card"><div class="row"><h3 class="grow">${new Date(t.date).toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' })}</h3><span class="muted">${t.matches.length} матчей</span></div>
        ${rows.map((r, i) => `<div class="row"><span class="muted" style="width:18px">${i + 1}</span><span class="sw" style="background:${r.team.color}"></span><b class="grow">${esc(r.team.name)}</b><span class="muted">${r.gf}:${r.ga}</span><b style="font-family:var(--f-num);font-size:17px;width:28px;text-align:right">${r.pts}</b></div>`).join('')}</section>`;
    }).join('');
  }
  return `<div class="wrap">
    <div><div class="label">Завершено турниров: ${H.length}</div><h2>История</h2></div>
    ${tabs}${body}
    <section class="card"><h3>Резервная копия</h3><p class="muted" style="margin:0">Данные хранятся только в этом браузере. Иногда копируй их в Заметки, чтобы не потерять.</p>
      <div class="row"><button class="btn" data-act="exportData">Скопировать данные</button><button class="btn" data-act="importData">Вставить данные</button></div></section>
  </div>`;
}

/* ---------- sheet & toast ---------- */
function openSheet(html) { document.getElementById('sheetBody').innerHTML = html; document.getElementById('sheet').hidden = false; }
function closeSheet() { document.getElementById('sheet').hidden = true; pickCb = null; }
let toastT;
function toast(msg) { const el = document.getElementById('toast'); el.textContent = msg; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => el.hidden = true, 2600); }

function picker(t, teamId, cb) {
  const x = team(t, teamId);
  pickCb = cb;
  openSheet(`<h3><span class="sw" style="background:${x.color}"></span> Гол · ${esc(x.name)}</h3><span class="muted">Кто забил?</span>
    <div class="picks">${x.players.map(p => `<button class="btn" data-act="pick" data-p="${p}">${esc(pname(p))}</button>`).join('')}
    <button class="btn ghost" data-act="pick" data-p="">Не указывать</button></div>
    <button class="btn ghost" data-act="closeSheet">Отмена</button>`);
}
function editSheet(i) {
  const t = S.cur, m = t.matches[i];
  const col = side => { const x = team(t, m[side]); return `<div>
      <div class="row"><span class="sw" style="background:${x.color}"></span><b class="grow">${esc(x.name)}</b></div>
      <div class="bigline">${score(m, side)}</div>
      <div class="gl">${m.goals.map((g, gi) => g.s === side ? `<span class="chip">⚽ ${esc(g.p ? pname(g.p) : 'без автора')}<button data-act="rmGoal" data-m="${i}" data-g="${gi}" aria-label="Удалить гол">×</button></span>` : '').join('')}</div>
      <button class="btn" data-act="addGoal" data-m="${i}" data-s="${side}">+ Гол</button></div>`; };
  openSheet(`<h3>Матч ${i + 1} · круг ${Math.floor(i / 3) + 1}</h3><div class="edit2">${col('a')}${col('b')}</div>
    <button class="btn primary block" data-act="closeSheet">Готово</button>`);
}
function timeSheet() {
  const L = S.cur.live, r = Math.ceil(rem(L));
  openSheet(`<h3>Время матча</h3>
    <div class="timeedit"><input id="tmin" type="number" inputmode="numeric" min="0" max="99" value="${Math.floor(r / 60)}" aria-label="Минуты"><span>:</span><input id="tsec" type="number" inputmode="numeric" min="0" max="59" value="${String(r % 60).padStart(2, '0')}" aria-label="Секунды"></div>
    <div class="row" style="justify-content:center">${[-60, -10, 10, 60].map(d => `<button class="btn" data-act="tadj" data-d="${d}">${d > 0 ? '+' : '−'}${Math.abs(d) >= 60 ? '1:00' : '0:10'}</button>`).join('')}</div>
    <div class="row end"><button class="btn ghost" data-act="closeSheet">Отмена</button><button class="btn primary" data-act="tsave">Сохранить</button></div>`);
}
function setRemaining(L, sec) {
  sec = Math.max(0, Math.min(99 * 60, sec));
  if (L.running) L.endAt = Date.now() + sec * 1000; else L.remaining = sec;
}
function finishTournament() {
  const t = S.cur;
  t.live = null; t.finished = true;
  if (t.matches.length) S.history.push(t);
  S.cur = null; S.draft = newDraft(); save();
  if (!t.matches.length) { closeSheet(); go('home'); return; }
  const rows = standings(t);
  openSheet(`<span class="label">Турнир завершён</span><h3>Победитель — ${esc(rows[0].team.name)}</h3>
    ${rows.map((r, i) => `<div class="row"><span class="muted" style="width:18px">${i + 1}</span><span class="sw" style="background:${r.team.color}"></span><b class="grow">${esc(r.team.name)}</b><span class="muted">${r.gf}:${r.ga}</span><b>${r.pts}</b></div>`).join('')}
    <button class="btn primary block" data-act="closeSheet">Готово</button>`);
  go('home');
}

/* ---------- actions ---------- */
const ACT = {
  nav: d => { closeSheet(); go(d.v); },
  closeSheet: () => { closeSheet(); render(); },
  tab: d => { statTab = d.k; render(); },
  // setup
  swatch: d => { const t = S.draft.teams[d.i]; if (!t.name.trim() || COLOR_NAMES.has(t.name)) t.name = d.n; t.color = d.c; save(); render(); },
  addPlayer: d => {
    const i = +d.i, inp = document.getElementById('pin' + i), p = playerByName(inp.value);
    if (!p) return;
    S.draft.teams.forEach(t => t.players = t.players.filter(x => x !== p.id));
    S.draft.teams[i].players.push(p.id); save(); render();
    const again = document.getElementById('pin' + i); again && again.focus();
  },
  pickKnown: d => { S.draft.teams[d.i].players.push(d.p); save(); render(); },
  rmPlayer: d => { S.draft.teams[d.i].players.splice(+d.j, 1); save(); render(); },
  step: d => {
    const f = d.f, lim = f === 'rounds' ? [1, 20] : [1, 45];
    S.draft[f] = Math.max(lim[0], Math.min(lim[1], S.draft[f] + +d.d)); save(); render();
  },
  first: d => { S.draft.first = +d.k; save(); render(); },
  sample: () => {
    const names = [['Иван Петров','Алексей Смирнов','Дмитрий Козлов','Сергей Волков'],
      ['Андрей Морозов','Павел Новиков','Максим Соколов','Егор Лебедев'],
      ['Никита Орлов','Олег Попов','Артём Зайцев','Роман Фёдоров']];
    S.draft.teams.forEach((t, i) => t.players = names[i].map(n => playerByName(n + ' (пример)').id));
    save(); render();
  },
  start: () => {
    const d = S.draft;
    if (d.teams.some(t => !t.name.trim())) { toast('У каждой команды должно быть название'); return; }
    const t = { id: uid(), date: Date.now(), rounds: d.rounds, duration: d.minutes * 60,
      teams: d.teams.map(x => ({ ...x, name: x.name.trim(), players: [...x.players] })), matches: [], live: null, finished: false };
    const [a, b] = PAIRS[d.first];
    t.first = [t.teams[a].id, t.teams[b].id];
    S.cur = t; ensureLive(t); save(); go('home');
  },
  // match
  play: () => {
    const L = S.cur.live; ac();
    if (L.running) { L.remaining = rem(L); L.running = false; whistle('pause'); keepAwake(false); }
    else { if (rem(L) <= 0) return; L.endAt = Date.now() + L.remaining * 1000; L.running = true; L.started = true; whistle('start'); keepAwake(true); }
    save(); render();
  },
  plus: d => {
    ac();
    const L = S.cur.live;
    picker(S.cur, L[d.s], pid => { L.goals.push({ s: d.s, p: pid || null }); L.started = true; save(); render(); toast('Гол' + (pid ? ': ' + pname(pid) : '')); });
  },
  minus: d => {
    const L = S.cur.live;
    for (let i = L.goals.length - 1; i >= 0; i--) if (L.goals[i].s === d.s) { L.goals.splice(i, 1); break; }
    save(); render();
  },
  pick: d => { const cb = pickCb; closeSheet(); cb && cb(d.p); },
  editTime: () => timeSheet(),
  tadj: d => {
    const mi = document.getElementById('tmin'), se = document.getElementById('tsec');
    let s = Math.max(0, (+mi.value || 0) * 60 + (+se.value || 0) + +d.d);
    mi.value = Math.floor(s / 60); se.value = String(s % 60).padStart(2, '0');
  },
  tsave: () => {
    const L = S.cur.live;
    setRemaining(L, (+document.getElementById('tmin').value || 0) * 60 + (+document.getElementById('tsec').value || 0));
    save(); closeSheet(); render();
  },
  finish: () => {
    const t = S.cur, L = t.live;
    openSheet(`<h3>Завершить матч?</h3>
      <div class="row" style="justify-content:center;gap:12px">${tn(t, L.a)}<span class="bigline">${score(L,'a')}:${score(L,'b')}</span>${tn(t, L.b)}</div>
      <div class="row end"><button class="btn ghost" data-act="closeSheet">Продолжить игру</button><button class="btn primary" data-act="finishYes">Завершить</button></div>`);
  },
  finishYes: () => {
    const t = S.cur, L = t.live, k = t.matches.length;
    L.running = false; keepAwake(false); whistle('end');
    const m = { id: uid(), a: L.a, b: L.b, goals: L.goals };
    t.matches.push(m); t.live = null; ensureLive(t); save();
    closeSheet(); go('home');
    const N = t.live;
    if (k === 0 && !winnerOf(m)) {
      const x = team(t, m.stay);
      openSheet(`<span class="label">Ничья · жребий</span><h3>Остаются: ${esc(x.name)}</h3>
        <div class="row" style="justify-content:center;gap:12px;padding:8px 0">${tn(t, N.a)}<span class="muted">—</span>${tn(t, N.b)}</div>
        <span class="muted">Порядок пар первого круга повторится во всех следующих кругах.</span>
        <button class="btn primary block" data-act="nav" data-v="match">К следующему матчу</button>`);
    } else if (N) toast(`Следующий: ${team(t, N.a).name} — ${team(t, N.b).name}`);
    else toast('Все матчи сыграны');
  },
  editM: d => editSheet(+d.m),
  rmGoal: d => { S.cur.matches[d.m].goals.splice(+d.g, 1); save(); render(); editSheet(+d.m); },
  addGoal: d => {
    const i = +d.m, m = S.cur.matches[i];
    picker(S.cur, m[d.s], pid => { m.goals.push({ s: d.s, p: pid || null }); save(); render(); editSheet(i); });
  },
  endT: () => {
    const L = S.cur.live, n = S.cur.matches.length;
    openSheet(`<h3>Завершить турнир?</h3><p class="muted" style="margin:0">Сыграно матчей: ${n}.${L && L.started ? ' Текущий матч не будет засчитан.' : ''} Результаты попадут в историю.</p>
      <div class="row end"><button class="btn ghost" data-act="closeSheet">Отмена</button><button class="btn primary" data-act="endYes">Завершить</button></div>`);
  },
  endYes: () => { keepAwake(false); finishTournament(); },
  exportData: () => {
    const txt = JSON.stringify(S);
    const fallback = () => openSheet(`<h3>Данные</h3><span class="muted">Выдели всё и скопируй в Заметки.</span><textarea id="exp" readonly>${esc(txt)}</textarea><button class="btn block" data-act="closeSheet">Закрыть</button>`);
    try { navigator.clipboard.writeText(txt).then(() => toast('Скопировано. Вставь в Заметки'), fallback); } catch (e) { fallback(); }
  },
  importData: () => openSheet(`<h3>Вставить данные</h3><span class="muted">Вставь сохранённый текст. Текущие данные заменятся.</span><textarea id="imp"></textarea>
    <div class="row end"><button class="btn ghost" data-act="closeSheet">Отмена</button><button class="btn primary" data-act="doImport">Загрузить</button></div>`),
  doImport: () => {
    try {
      const s = JSON.parse(document.getElementById('imp').value);
      if (!s || !Array.isArray(s.players) || !Array.isArray(s.history)) throw 0;
      S = s; if (!S.draft) S.draft = newDraft(); save(); closeSheet(); go('stats'); toast('Данные загружены');
    } catch (e) { toast('Не получилось прочитать текст'); }
  },
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act];
  if (fn) fn(el.dataset, el);
});
document.addEventListener('input', e => {
  const el = e.target, f = el.dataset && el.dataset.field;
  if (!f) return;
  const t = S.draft.teams[el.dataset.i];
  if (f === 'name') { t.name = el.value; save(); }
  if (f === 'color') { t.color = el.value; save(); el.closest('.tcard').style.setProperty('--tc', el.value); }
});
document.addEventListener('change', e => { if (e.target.dataset && e.target.dataset.field) render(); });
document.addEventListener('keydown', e => {
  const el = e.target;
  if (e.key === 'Enter' && el.dataset && el.dataset.enter) { e.preventDefault(); ACT[el.dataset.enter](el.dataset); }
});

render();
</script>
